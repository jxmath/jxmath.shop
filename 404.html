<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>404 | jaxsons math</title>
  <meta name="theme-color" content="#171a30">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <script>try{var t=localStorage.getItem("jm-theme");if(t&&t!=="moonlight")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <style>
:root {
  --bg: #171a30;
  --bg-card: #1e2240;
  --chip: #2a2f55;
  --chip-hover: #373d6b;
  --text: #dbe2ff;
  --accent: #aab8ff;
  --accent-text: #171a30;
  --border: rgba(205, 214, 255, 0.12);
  --bg-fx: radial-gradient(circle at 91% 10%, #f4f6ff 0 15px, rgba(214,222,255,0.5) 16px, rgba(150,165,255,0.16) 64px, transparent 150px), radial-gradient(ellipse 70% 45% at 85% 0%, rgba(140,155,255,0.16), transparent 70%), radial-gradient(ellipse 80% 50% at 0% 100%, rgba(80,95,200,0.18), transparent 70%);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
:root[data-theme="purple"] {
  --bg: #241833;
  --bg-card: #2e2142;
  --chip: #3d2c56;
  --text: #f6f0ff;
  --accent: #c4a6f5;
  --accent-text: #241833;
  --border: rgba(220, 200, 250, 0.16);
  --bg-fx: radial-gradient(circle at 91% 10%, #f1e6ff 0 9px, rgba(196,166,245,0.32) 10px, rgba(196,166,245,0.12) 58px, transparent 140px), radial-gradient(ellipse 70% 45% at 85% 0%, rgba(196,166,245,0.13), transparent 70%), radial-gradient(ellipse 80% 50% at 0% 100%, rgba(196,166,245,0.12), transparent 70%);
}
:root[data-theme="ocean"] {
  --bg: #102833;
  --bg-card: #173440;
  --chip: #214555;
  --text: #eef8fb;
  --accent: #8fd4e4;
  --accent-text: #102833;
  --border: rgba(180, 230, 240, 0.16);
  --bg-fx: radial-gradient(circle at 91% 10%, #e6f9ff 0 9px, rgba(143,212,228,0.32) 10px, rgba(143,212,228,0.12) 58px, transparent 140px), radial-gradient(ellipse 70% 45% at 85% 0%, rgba(143,212,228,0.13), transparent 70%), radial-gradient(ellipse 80% 50% at 0% 100%, rgba(143,212,228,0.12), transparent 70%);
}
:root[data-theme="forest"] {
  --bg: #17261c;
  --bg-card: #1f3226;
  --chip: #2a4334;
  --text: #f0f7ec;
  --accent: #a8d492;
  --accent-text: #17261c;
  --border: rgba(200, 230, 190, 0.16);
  --bg-fx: radial-gradient(circle at 91% 10%, #f1ffe6 0 9px, rgba(168,212,146,0.32) 10px, rgba(168,212,146,0.12) 58px, transparent 140px), radial-gradient(ellipse 70% 45% at 85% 0%, rgba(168,212,146,0.13), transparent 70%), radial-gradient(ellipse 80% 50% at 0% 100%, rgba(168,212,146,0.12), transparent 70%);
}
:root[data-theme="ember"] {
  --bg: #2a1c18;

  --border: rgba(255, 210, 190, 0.16);
  --bg-fx: radial-gradient(circle at 91% 10%, #fff0e6 0 9px, rgba(240,176,138,0.32) 10px, rgba(240,176,138,0.12) 58px, transparent 140px), radial-gradient(ellipse 80% 46% at 50% 100%, rgba(240,140,90,0.22), transparent 70%);
}
:root[data-theme="gruvbox"] {
  --bg: #32302f;
  --bg-card: #3c3836;
  --chip: #504945;
  --text: #fbf1c7;
  --accent: #fabd2f;
  --accent-text: #32302f;
  --border: rgba(251, 241, 199, 0.14);
  --bg-fx: radial-gradient(circle at 91% 10%, #fff2c4 0 9px, rgba(250,189,47,0.32) 10px, rgba(250,189,47,0.12) 58px, transparent 140px), radial-gradient(ellipse 70% 45% at 85% 0%, rgba(250,189,47,0.13), transparent 70%), radial-gradient(ellipse 80% 50% at 0% 100%, rgba(250,189,47,0.12), transparent 70%);
}
:root[data-theme="sakura"] {
  --bg: #1c1017;
  --bg-card: #291720;
  --chip: #3a2130;
  --text: #ffeef4;
  --accent: #ff8fb8;
  --accent-text: #2a0f1d;
  --border: rgba(255, 205, 225, 0.12);
  --bg-fx: radial-gradient(ellipse 70% 46% at 86% 0%, rgba(255,143,184,0.22), transparent 70%), radial-gradient(ellipse 70% 40% at 0% 100%, rgba(255,120,160,0.13), transparent 70%);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-weight: 600;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: var(--bg-fx);
  pointer-events: none;
  z-index: 0;
}

#particles {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

.notfound {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  gap: 12px;
}

.notfound h1 {
  font-size: 72px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--text);
}

.notfound p {
  font-size: 16px;
  color: var(--text);
  opacity: 0.65;
  margin-bottom: 8px;
}

.notfound a {
  color: var(--text);
  text-decoration: none;
  background: var(--chip);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 700;
  transition: background 0.2s var(--ease), color 0.2s var(--ease), border-color 0.2s var(--ease);
}

.notfound a:hover {
  background: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
}
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="notfound">
    <h1>404</h1>
    <p>page not found</p>
    <a href="/">back home</a>
  </div>
  <script>
    (function () {
      var canvas = document.getElementById("particles");
      var ctx = canvas && canvas.getContext("2d");
      if (!ctx) return;
      var kinds = { purple: "snow", ocean: "snow", forest: "snow", ember: "snow", gruvbox: "dust", sakura: "petals" };
      var kind = kinds[document.documentElement.getAttribute("data-theme")] || "stars";
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var w = 0, h = 0, ps = [];
      var count = kind === "stars" ? 70 : kind === "petals" ? 28 : 50;
      function rnd(a, b) { return a + Math.random() * (b - a); }
      function make(top) {
        var p = { x: rnd(0, w), y: top ? -8 : rnd(0, h), a: rnd(0.15, 0.55), t: rnd(0, 6.28), s: rnd(0.02, 0.05) };
        if (kind === "stars") { p.r = rnd(0.6, 1.8); p.vx = 0; p.vy = 0; }
        else if (kind === "dust") { p.r = rnd(0.8, 2); p.vx = rnd(-0.1, 0.1); p.vy = rnd(-0.12, 0.12); }
        else if (kind === "petals") { p.r = rnd(3, 5.5); p.vx = rnd(-0.3, 0.2); p.vy = rnd(0.5, 1.1); p.a = rnd(0.5, 0.85); }
        else { p.r = rnd(1.4, 4.6); p.vx = rnd(-0.075, 0.075); p.vy = rnd(0.35, 1.25); }
        return p;
      }
      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        ps = [];
        for (var i = 0; i < count; i++) ps.push(make(false));
      }
      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < ps.length; i++) {
          var p = ps[i];
          p.t += p.s;
          if (!reduce) {
            p.x += p.vx + (kind === "petals" ? Math.sin(p.t) * 0.4 : 0);
            p.y += p.vy;
            if (p.x < -10) p.x = w + 10;
            if (p.x > w + 10) p.x = -10;
            if (p.y > h + 10) { p.y = -8; p.x = rnd(0, w); }
            if (p.y < -10) p.y = h + 10;
          }
          ctx.beginPath();
          if (kind === "petals") {
            ctx.fillStyle = "rgba(255,183,209," + p.a + ")";
            ctx.ellipse(p.x, p.y, p.r, p.r * 0.6, p.t, 0, 6.2832);
          } else if (kind === "stars") {
            ctx.fillStyle = "rgba(255,255,255," + (p.a * (0.6 + 0.4 * Math.sin(p.t))) + ")";
            ctx.arc(p.x, p.y, p.r, 0, 6.2832);
          } else if (kind === "dust") {
            ctx.fillStyle = "rgba(235,200,140," + p.a * 0.7 + ")";
            ctx.arc(p.x, p.y, p.r, 0, 6.2832);
          } else {
            ctx.fillStyle = "rgba(255,255,255," + p.a + ")";
            ctx.arc(p.x, p.y, p.r, 0, 6.2832);
          }
          ctx.fill();
        }
        if (!reduce) requestAnimationFrame(draw);
      }
      resize();
      draw();
      window.addEventListener("resize", resize);
    })();
  </script>
</body>
</html>
