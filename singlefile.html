<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jxmath</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #0b1020; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    #jm-boot { opacity: 0.7; font-weight: 600; }
  </style>
</head>
<body>
  <div id="jm-boot">loading...</div>
  <script>
    (function () {
      var sources = [
        "https://raw.githubusercontent.com/jxmath/jxmath.shop/main/index.html",
        "https://cdn.jsdelivr.net/gh/jxmath/jxmath.shop@main/index.html",
        "index.html"
      ];
      function load(i) {
        if (i >= sources.length) {
          document.getElementById("jm-boot").textContent = "couldn't load the site";
          return;
        }
        var url = sources[i] + (i < 2 ? "?t=" + Date.now() : "");
        fetch(url, { cache: "no-store" })
          .then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.text();
          })
          .then(function (html) {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(function () { load(i + 1); });
      }
      load(0);
    })();
  </script>
</body>
</html>
